name: validate-skill

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts
      - run: python scripts/unciv_mod.py audit
      - run: >-
          python scripts/unciv_mod.py check examples/tested-feature-recipes/Recipe-Lab
          --source-only
          --base-ruleset "Civ V - Gods & Kings"
          --output "${{ runner.temp }}/recipe-lab-preflight.json"
      - run: >-
          python scripts/unciv_mod.py verify
          examples/tested-feature-recipes/verification.json
          --output examples/tested-feature-recipes/VERIFICATION.md
          --check
